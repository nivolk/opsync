[project]
name = "opsync"
version = "0.3.2"
description = "Агенты ведут задачи в OpenProject: спринт, статусы, комментарии, время, план"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.19.1",
    "mcp>=2.3,<3",
]

[project.scripts]
opsync = "opsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
